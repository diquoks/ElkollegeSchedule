name: elkollege_schedule_app
description: "Приложение для просмотра актуального расписания ЭК"
repository: https://github.com/diquoks/ElkollegeScheduleApp
publish_to: none
version: 1.0.0-dev

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.10.0
  pocketbase: ^0.25.3
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  fonts:
    - family: OpenSans
      fonts:
        - asset: fonts/OpenSans.ttf
        - asset: fonts/OpenSans-Italic.ttf
          style: italic
